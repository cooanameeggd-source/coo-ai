name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (found $JAVA_MAJOR)."
            exit 1
          fi
          echo "Java version verification passed: Java $JAVA_MAJOR is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be verified or created."
            exit 1
          fi
          echo "Debug keystore confirmed at ./debug.keystore."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK not found!"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: APK $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: $TARGET_APK does not end in .apk"; exit 1 ;;
          esac
          echo "APK successfully verified at $TARGET_APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TEMP_DIR/app-debug.apk"
          cp "$SOURCE_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "Error: Failed to prepare APK release asset."
            exit 1
          fi
          echo "Prepared release asset at: $DEST_APK"
          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          APK_PATH="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Prepared APK does not exist at $APK_PATH."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Prepared APK is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *) echo "Error: Asset file does not end in .apk"; exit 1 ;;
          esac
          FILENAME=$(basename "$APK_PATH")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be app-debug.apk, found $FILENAME."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run: #${{ github.run_number }}
          - GitHub Actions Attempt: #${{ github.run_attempt }}
          - Source Commit: ${{ github.sha }}

          Notice:
          - This APK is intended for testing.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.create_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=== GitHub Release Successfully Created ==="
            gh release view "$RELEASE_TAG"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"
            echo "Actions backup artifact 'app-debug-apk' remains available."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "- Direct download asset: \`app-debug.apk\`"
              echo "- Backup artifact: \`app-debug-apk\` is also available under Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "APK build succeeded and the normal Actions artifact 'app-debug-apk' remains available as a backup."
            fi
            echo "Please check the Actions artifacts for the built APK."
          fi
